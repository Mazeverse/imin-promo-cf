<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="google-site-verification" content="BtBII3918J1J9BnNiNfjVaPn0QXfIj5xoi1G_8qtFk4" />

  <meta name="description" content="아임인(imin) 신규 가입 시 프로모션 코드 ZGK29HT3I1 또는 ICTLYNCO를 입력하고 특별한 혜택을 받으세요." />
  <meta name="keywords" content="아임인 프로모션 코드, 아임인 추천인, imin 프로모션코드, 아임인 가입혜택" />
  <meta name="robots" content="index,follow" />
  <link rel="canonical" href="https://imin-promo-cf.pages.dev/" />
  
  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="아임인(imin) 프로모션 코드 공유" />
  <meta property="og:description" content="ZGK29HT3I1 / ICTLYNCO 중 하나를 입력하고 아임인 혜택을 받으세요." />
  <meta property="og:url" content="https://imin-promo-cf.pages.dev/" />
  
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%236347ff'/><text y='.75em' x='5' font-size='60' fill='white' font-weight='bold'>imin</text></svg>" />

  <style>
    :root {
      --imin-purple: #6347ff;
      --imin-light: #f0eeff;
      --text-dark: #2d2d35;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #f8f9fd;
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans KR", sans-serif;
      color: var(--text-dark);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 600px;
      width: 100%;
      text-align: center;
    }
    .header { margin-bottom: 40px; }
    .header img { width: 80px; height: 80px; border-radius: 18px; margin-bottom: 15px; box-shadow: 0 8px 20px rgba(99, 71, 255, 0.2); }
    .header h1 { font-size: 26px; font-weight: 800; color: var(--imin-purple); margin-bottom: 10px; }
    .header p { font-size: 15px; color: #666; line-height: 1.6; }

    .code-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-bottom: 30px;
    }
    .code-card {
      background: #fff;
      border: 2px solid #eee;
      border-radius: 20px;
      padding: 25px 15px;
      transition: all 0.3s ease;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }
    .code-card:hover {
      border-color: var(--imin-purple);
      transform: translateY(-5px);
      box-shadow: 0 10px 25px rgba(99, 71, 255, 0.1);
    }
    .code-card .label {
      font-size: 12px;
      font-weight: 700;
      color: #999;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .code-card .code-val {
      font-size: 18px;
      font-weight: 800;
      color: var(--imin-purple);
      letter-spacing: 0.5px;
      margin-bottom: 15px;
      word-break: break-all;
    }
    .copy-btn {
      background: var(--imin-light);
      color: var(--imin-purple);
      border: none;
      padding: 8px 15px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      width: 100%;
      cursor: pointer;
      transition: 0.2s;
    }
    .code-card:hover .copy-btn {
      background: var(--imin-purple);
      color: #fff;
    }

    .info-box {
      background: #fff;
      padding: 20px;
      border-radius: 15px;
      font-size: 14px;
      color: #555;
      line-height: 1.8;
      border-left: 4px solid var(--imin-purple);
      text-align: left;
    }
    .footer {
      margin-top: 40px;
      font-size: 12px;
      color: #bbb;
    }

    .toast {
      position: fixed;
      top: 20px;
      background: var(--imin-purple);
      color: white;
      padding: 12px 25px;
      border-radius: 30px;
      font-weight: 600;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      opacity: 0;
      transition: 0.3s;
      pointer-events: none;
    }
    .toast.show { opacity: 1; top: 40px; }

    @media (max-width: 480px) {
      .code-grid { grid-template-columns: 1fr; }
      .header h1 { font-size: 22px; }
    }
  </style>
</head>
<body>

  <div class="container">
    <header class="header">
      <img src="https://is1-ssl.mzstatic.com/image/thumb/Purple126/v4/0e/8e/8e/0e8e8e8e-0e8e-0e8e-0e8e-0e8e8e8e0e8e/AppIcon-0-0-1x_U007emarketing-0-0-0-7-0-0-sRGB-0-0-0-GLES2_U002c0-512MB-85-220-0-0.png/230x0w.webp" alt="imin logo" onerror="this.src='data:image/svg+xml,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 100 100\'><rect width=\'100\' height=\'100\' fill=\'%236347ff\'/></svg>'">
      <h1>아임인 프로모션 코드</h1>
      <p>목돈 만들기 플랫폼 <strong>아임인(imin)</strong> 가입 시<br>아래 코드 중 하나를 입력하고 혜택을 받으세요!</p>
    </header>

    <div class="code-grid">
      <!-- 코드 1 -->
      <div class="code-card" onclick="copyCode('ZGK29HT3I1')">
        <div class="label">PROMO CODE 01</div>
        <div class="code-val">ZGK29HT3I1</div>
        <button class="copy-btn">복사하기</button>
      </div>
      <!-- 코드 2 -->
      <div class="code-card" onclick="copyCode('ICTLYNCO')">
        <div class="label">PROMO CODE 02</div>
        <div class="code-val">ICTLYNCO</div>
        <button class="copy-btn">복사하기</button>
      </div>
    </div>

    <div class="info-box">
      💡 <strong>사용 방법:</strong><br>
      1. 아임인 앱 설치 및 회원가입 진행<br>
      2. 추천인/프로모션 코드 입력란에 위 코드 중 하나 입력<br>
      3. 가입 완료 후 제공되는 신규 혜택 확인!
    </div>

    <footer class="footer">
      이 페이지는 아임인 프로모션 정보 공유를 위해 제작되었습니다.
    </footer>
  </div>

  <div id="toast" class="toast">✅ 코드가 복사되었습니다!</div>

  <script>
    function copyCode(val) {
      const t = document.createElement("textarea");
      document.body.appendChild(t);
      t.value = val;
      t.select();
      document.execCommand('copy');
      document.body.removeChild(t);

      const toast = document.getElementById('toast');
      toast.classList.add('show');
      setTimeout(() => { toast.classList.remove('show'); }, 2000);
    }
  </script>
</body>
</html>
